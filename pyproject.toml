[tool.poetry]
name = "bank-transactions-widget"
version = "0.1.0"
description = "Bank transactions analytics widget and JSON reports generator"
readme = "README.md"
license = "MIT"
authors = ["Ksenia <gertrudadeputat@gmail.com>"]
keywords = ["banking", "analytics", "pandas", "json"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
pandas = ">=2.0.0"
openpyxl = ">=3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
black = ">=23.0.0"
flake8 = ">=6.0.0"
mypy = ">=1.10.0"
pytest-cov = ">=4.1.0"
isort = "^8.0.1"
autoflake = "^2.3.3"
pyupgrade = "^3.21.2"
flake8-bugbear = "^25.11.29"
requests-mock = "^1.12.1"
autopep8 = "^2.3.2"
ruff = "^0.16.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "Q"]
ignore = []

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.flake8]
max-line-length = 120