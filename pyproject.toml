
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-transactions-widget"
version = "0.1.0"
description = "Виджет аналитики банковских транзакций и генерации JSON-отчетов"
readme = "README.md"
requires-python = ">=3.9"
license = { identifier = "MIT" }
authors = [
  { name = "Ksenia", email = "gertrudadeputat@gmail.com" }
]
keywords = ["banking", "analytics", "pandas", "json"]

dependencies = [
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "black>=23.0.0",
  "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]